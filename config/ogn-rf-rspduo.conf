// ogn-rf configuration for an SDRplay RSPduo on the European OGN channels
//
// Every key below is one that ogn-rf.cc actually looks up. That matters more than it sounds: a
// mistyped key is silently ignored and the built-in default is used instead, with no warning.
//
// Differences from an RTL-SDR configuration, all of them forced by the hardware or the API:
//
//  * RF.DeviceType selects the backend. "rspduo" works only in a binary built with USE_RSPDUO=1
//    (see scripts/build-ogn-rf.sh); a binary without it falls back to RTL-SDR and says so at open.
//
//  * RF.SampleRate must be 2000000. The RSPduo's ADC produces 2, 6 or 8 MHz in single-tuner mode
//    and nothing else, so the backend snaps whatever it is given to the nearest of those and
//    reports the rate it applied. An RTL-SDR-style 2048000 would be snapped to 2000000 without
//    complaint, and the OGN channels would land somewhere other than where the frequency plan
//    expects - so ask for the real rate.
//
//  * RF.FreqCorr is a genuine ppm control on this radio, not a software shift: the RSPduo has its
//    own ppm register, so what is set here is what the synthesiser does. Measure it with gsm_scan
//    first; leave it at 0 until then.
//
//  * RF.BiasTee and RF.OfsTune are accepted and ignored. The RSPduo has no bias tee (the RSP2 and
//    RSPdx do) and no offset-tuning trick. They stay in the file only so the same configuration
//    can be moved between radios.
//
//  * RF.FreqRaster is 1, i.e. no rounding. The RSPduo tunes to about 1 Hz resolution, so there is
//    no reason to snap to the 28.125 kHz raster that RTL-SDR dongles need.
//
//  * RF.OGN.Gain is in dB. The backend maps it onto the RSPduo's (IF gain reduction, LNA state)
//    pair; see docs/hardware.md for what the numbers mean on this board.
//
// Note: libconfig has no "outer braces" form - the settings start at the top level.

RF = {
  DeviceType = "rspduo";
  Device     = 0;                 // enumeration index; pin it with DeviceSerial once known
//DeviceSerial = "0000000000";    // an RSPduo serial, once the API has reported one

  FreqPlan   = 1;                 // Europe/Africa: hops between 868.200 and 868.400 MHz
  FreqRaster = 1;                 // [Hz] no rounding
  FreqCorr   = 0;                 // [ppm] genuine ppm control; measure with gsm_scan first
  SampleRate = 2000000;           // [Hz] the only sensible RSPduo rate for OGN
  BiasTee    = 0;                 // no bias tee on an RSPduo; accepted and ignored
  OfsTune    = 0;                 // no offset tuning; accepted and ignored

  // Both RSPduo tuners at once. Tuner A carries the stream ogn-rf decodes; tuner B is the second,
  // independently-tuned receiver. 1 = dual, 0 = single-tuner.
  //
  // In dual mode the API imposes its own rate/bandwidth/IF/decimation combination and IF_Zero is
  // not available, so the backend runs a 2 MHz ADC with 0.6 MHz bandwidth at IF 450 kHz,
  // decimated by 2 - i.e. 1 Msps per tuner, and tuner B defaults to Frequency + 100 kHz. One
  // tuner at 2 MSps already covers both OGN channels, which is why 0 is a perfectly good
  // default; dual mode is for actually using the second tuner.
  RSPduo = {
    DualTuner = 1;

    // Selection diversity: both tuners on the SAME frequency, and each read uses whichever saw
    // more signal. Needs two antennas that fade independently - λ/2 apart at 868.3 MHz is 17.3 cm,
    // and VERTICAL separation is what decorrelates the ground-bounce multipath that causes fades
    // on low-elevation aircraft. Horizontal spacing mostly decorrelates azimuthal scatter.
    //
    // This is the cheap end of diversity: no phase calibration, no combining maths, and it can
    // never be worse than the better of the two antennas. Maximal-ratio combining would gain up
    // to 3 dB more but needs the measured ~117 deg inter-tuner phase offset tracked continuously.
    //
    // Set to 0 to keep the two tuners on separate channels (A at the plan centre, B +100 kHz).
    SelectionDiversity = 1;
  };

  OGN = {
    // [dB] total gain. Measured on this unit: total = 115.8 - gRdB at LNA state 0, so the
    // reachable range is 56.8 dB (quietest) to 95.8 dB (loudest).
    //
    // 95 dB rather than 90 because the gain determines how much of the 8-bit stream a weak signal
    // occupies, and weak is exactly what "long range" means. Measured with two antennas attached:
    //
    //   gRdB 40 -> peak 7 counts of 128  (3.8 bits), 0 dB overload
    //   gRdB 30 -> peak 23 counts        (5.5 bits)
    //   gRdB 26 -> peak 39 counts        (6.3 bits)   <- what 90 dB gave
    //   gRdB 20 -> peak 89 counts        (7.5 bits), still no overload
    //
    // So the old setting was discarding about 7 dB of level that the converter could hold without
    // clipping. Re-check for overload if you add a transmitter nearby.
    Gain     = 95.0;
    GainMode = 1;                 // 1 = manual gain, as ogn-rf requires
    // How much of each second is read. The default leaves room for the demodulator; raise
    // SensTime only if ogn-rf prints "Half time slot".
    SensTime  = 0.850;            // [sec]
    StartTime = 0.375;            // [sec] offset into the time slot at which reading begins
  };

  // The RSPduo's API service owns the USB device, so nothing here talks to hardware directly.
  // If ogn-rf reports "ServiceNotResponding" when opening, the daemon is down:
  //     sudo systemctl start sdrplay
};

// Receiver identity. APRS.Call becomes the prefix of any recorded file, and is what the OGN
// network knows the station by, so set it to the callsign OGN assigned to this receiver.
APRS = {
  Call = "RSPduo";
};

// Position, in degrees; positive is north and east. ogn-rf uses this to pick a hopping plan when
// RF.FreqPlan is left at 0. With an explicit FreqPlan above it is informational, but keep it
// right: it is embedded in the data the receiver reports.
Position = {
  Latitude  =  52.000000;
  Longitude =   0.000000;
};

// The HTTP status page. This is the quickest way to see whether the receiver is healthy:
//     http://xavieragx.local:8095/
HTTP = {
  Port = 8095;
};
